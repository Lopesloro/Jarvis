[project]
name = "jarvis-core"
version = "0.1.0"
description = "Núcleo do Jarvis: modelos, motor de prioridade, ingestão e API"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
openjarvis = ["openjarvis"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["eval: avaliação do motor de prioridade com conjunto rotulado"]

[tool.ruff]
line-length = 100
target-version = "py311"
