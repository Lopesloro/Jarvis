[project]
name = "jarvis-core"
version = "0.1.0"
description = "Núcleo do Jarvis: modelos, motor de prioridade, ingestão e API"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.28.1",
  "qrcode>=8.2",
  "icalendar>=7.3.0",
  "recurring-ical-events>=3.8.2",
]

[project.optional-dependencies]
openjarvis = ["openjarvis"]
dev = ["pytest>=8", "pytest-cov>=6", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["eval: avaliação do motor de prioridade com conjunto rotulado"]
# Cobertura de 100% (linhas e ramos) é obrigatória: abaixo disso o pytest falha.
addopts = "--cov=jarvis_core --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100"

[tool.coverage.run]
source = ["jarvis_core"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
# Só o ponto de entrada do processo fica de fora; todo o resto precisa de teste.
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py311"
