# Gerado de core/jarvis_core/api/main.py: rode scripts/gerar_contratos.py
openapi: 3.1.0
info:
  title: Jarvis
  version: 0.1.0
paths:
  /saude:
    get:
      summary: Saude
      operationId: saude_saude_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Saude Saude Get
  /v1/agora:
    get:
      summary: Agora
      operationId: agora_v1_agora_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Agora V1 Agora Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/inbox:
    get:
      summary: Inbox
      operationId: inbox_v1_inbox_get
      parameters:
      - name: faixa
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/Faixa'
          - type: 'null'
          title: Faixa
      - name: canal
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - gmail
            - whatsapp
            - agenda
            type: string
          - type: 'null'
          title: Canal
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limite
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Inbox V1 Inbox Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/itens/{item_id}/decisao:
    post:
      summary: Decidir
      operationId: decidir_v1_itens__item_id__decisao_post
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      - name: authorization
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decisao'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Decidir V1 Itens  Item Id  Decisao Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Decisao:
      properties:
        decisao:
          type: string
          enum:
          - resolver
          - adiar
          - arquivar
          title: Decisao
        nota_correta:
          anyOf:
          - $ref: '#/components/schemas/Faixa'
          - type: 'null'
        observacao:
          anyOf:
          - type: string
          - type: 'null'
          title: Observacao
      type: object
      required:
      - decisao
      title: Decisao
    Faixa:
      type: string
      enum:
      - agora
      - hoje
      - semana
      - arquivar
      title: Faixa
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
